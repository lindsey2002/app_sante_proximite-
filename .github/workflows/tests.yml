name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '3.4.11'
      SERVERPOD_PASSWORD_database: '444I1TwkWKdG0vj3zDEs2GXNUg6QBYLS'
      SERVERPOD_PASSWORD_redis: 'o8fj2q0adFbl1tUHubFQtzmBjP_lggRx'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Start containers
        working-directory: sante_proximite_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        run: dart pub global activate serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: sante_proximite_server
        run: serverpod generate

      - name: Run tests
        working-directory: sante_proximite_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: sante_proximite_server
        run: docker compose down -v
